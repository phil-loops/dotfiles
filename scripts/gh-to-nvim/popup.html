<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="status" id="status">
      <span class="dot" id="dot"></span>
      <div class="lines">
        <span class="label" id="label">Checking…</span>
        <span class="detail" id="detail">viewer :62497</span>
      </div>
    </div>
    <a class="forest" id="forest" target="_blank" hidden>
      <span class="forest-name" id="forest-name"></span>
      <span class="forest-detail" id="forest-detail"></span>
    </a>
    <button class="btn launch" id="launch" hidden>▶&nbsp; Launch viewer</button>
    <button class="btn primary" id="open-nvim">→&nbsp; nvim this page</button>
    <button class="btn" id="reload">↻&nbsp; Reload extension</button>
    <button class="btn" id="viewer">↗&nbsp; Open forest viewer</button>
    <p class="hint">⌘⇧O → nvim · ⌘⇧U → viewer (rebind at chrome://extensions/shortcuts)</p>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
