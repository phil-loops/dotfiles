<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <button class="open" id="open">
      <span class="open-head">
        <span class="open-title" id="open-title">Open Show</span>
        <kbd>⌘⇧U</kbd>
      </span>
      <span class="open-what" id="open-what"></span>
      <span class="open-detail" id="open-detail"></span>
    </button>
    <div class="last-error" id="last-error" hidden></div>
    <button class="fix" id="fix" hidden>
      <span class="dot" id="dot"></span>
      <span class="fix-label" id="fix-label"></span>
      <span class="fix-act" id="fix-act"></span>
    </button>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
