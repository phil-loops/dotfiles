<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review load</title>
<style>
:root {
  color-scheme: light;
  --page: #f5f4f1; --surface: #fcfcfb; --raised: #ffffff; --line: #e4e2dc;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #85837d;
  --s-approved: #2a78d6; --s-commented: #eb6834; --s-changes: #1baf7a;
  --seq: #1c5cab; --accent: #2a78d6; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #121211; --surface: #1a1a19; --raised: #222220; --line: #33332f;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8b8a82;
    --s-approved: #3987e5; --s-commented: #d95926; --s-changes: #199e70;
    --seq: #3987e5; --accent: #3987e5; --critical: #e66767;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2); margin: 0 0 12px; font-weight: 600; }
.pitch { color: var(--text-2); margin: 4px 0 0; max-width: 62ch; }
.controls { display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--text-2); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--page); }
kbd, .kbtn { border: 1px solid var(--line); background: var(--surface); color: var(--text-2); border-radius: 6px; padding: 5px 9px; font: 12px ui-monospace, SFMono-Regular, monospace; cursor: pointer; }
.meta { color: var(--text-3); font-size: 12px; margin: 10px 0 20px; min-height: 18px; }
.meta .err { color: var(--critical); }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-left: 6px; color: var(--text-2); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.tile, .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tile { padding: 14px 16px; }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--text-2); font-size: 12px; }
.card { padding: 18px 18px 14px; margin-bottom: 20px; overflow-x: auto; }
.cardhead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; color: var(--text-2); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 10px; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 4px; }
thead th { color: var(--text-3); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
thead th[aria-sort] { color: var(--text); }
tbody tr { border-bottom: 1px solid var(--line); cursor: pointer; }
tbody tr:last-child { border-bottom: 0; }
tbody tr:hover, tbody tr.sel { background: var(--raised); }
tbody tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
td.barcell { width: 34%; text-align: left; }
.bar { display: flex; gap: 2px; height: 12px; align-items: stretch; }
.bar span { min-width: 2px; }
.bar span:last-child { border-radius: 0 4px 4px 0; }
.muted { color: var(--text-3); }
.bottag { font-size: 11px; color: var(--text-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
.matrix th, .matrix td { text-align: center; padding: 0; }
.matrix thead th { cursor: default; padding: 0 2px 8px; font-size: 11px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; }
.matrix tbody tr { border: 0; cursor: default; }
.matrix tbody tr:hover { background: none; }
.matrix tbody th { text-align: left; font-weight: 400; padding-right: 12px; color: var(--text-2); }
.matrix td div { margin: 1px; height: 30px; min-width: 52px; border-radius: 4px; display: grid; place-items: center; font-size: 12px; }
.matrix td div.on { cursor: pointer; }
.matrix td div.self { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px); }
.axis { color: var(--text-3); font-size: 12px; margin: 0 0 10px; }
.detail h3 { margin: 0; font-size: 16px; }
.detail .sub { color: var(--text-2); margin: 2px 0 14px; }
.detail h4 { margin: 18px 0 6px; font-size: 12px; color: var(--text-2); font-weight: 600; }
.detail tbody tr { cursor: default; }
.detail td.t { text-align: left; white-space: normal; max-width: 460px; }
.detail td, .detail th { text-align: left; }
.detail td.num, .detail th.num { text-align: right; }
a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
.empty { color: var(--text-3); padding: 28px 4px; }
#tip { position: fixed; pointer-events: none; background: var(--text); color: var(--page); padding: 6px 9px; border-radius: 6px; font-size: 12px; white-space: pre; z-index: 30; display: none; }
#k { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); display: none; align-items: flex-start; justify-content: center; padding-top: 16vh; z-index: 40; }
#k.open { display: flex; }
#k .box { width: min(560px, 92vw); background: var(--raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px rgb(0 0 0 / 0.3); overflow: hidden; }
#k input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: 16px inherit; padding: 14px 16px; outline: none; }
#k ul { list-style: none; margin: 0; padding: 6px; max-height: 46vh; overflow: auto; }
#k li { padding: 8px 10px; border-radius: 7px; display: flex; justify-content: space-between; gap: 12px; cursor: pointer; }
#k li.act { background: var(--accent); color: #fff; }
#k li small { opacity: 0.7; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Review load <span class="muted" id="repo"></span></h1>
      <p class="pitch">Who's carrying review, and for whom — on closed PRs where a human was asked to review.</p>
    </div>
    <div class="controls">
      <div class="seg" id="seg"></div>
      <button class="kbtn" id="kbtn">⌘K</button>
    </div>
  </header>
  <div class="meta" id="meta"></div>
  <div class="tiles" id="tiles"></div>
  <section class="card">
    <div class="cardhead">
      <h2>By member</h2>
      <div class="legend">
        <span><i style="background:var(--s-approved)"></i>approved</span>
        <span><i style="background:var(--s-commented)"></i>commented only</span>
        <span><i style="background:var(--s-changes)"></i>changes requested</span>
      </div>
    </div>
    <div id="members"></div>
  </section>
  <section class="card detail" id="detail" hidden></section>
  <section class="card">
    <h2>Who reviews whom</h2>
    <p class="axis">Rows review, columns author. Cell = PRs by the column's author that the row's member reviewed.</p>
    <div id="matrix"></div>
  </section>
</main>
<div id="tip"></div>
<div id="k"><div class="box"><input id="kq" placeholder="Type a command or member…" autocomplete="off" spellcheck="false"><ul id="kl"></ul></div></div>
<script>
const WINDOWS = [7, 14, 30, 90];
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const state = { data: null, days: store.get("rs.days", 14), mergedOnly: store.get("rs.merged", false), bots: store.get("rs.bots", false), sort: { key: "reviewed", dir: -1 }, member: null, pair: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const median = (xs) => { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const dur = (h) => h == null ? "—" : h < 1 ? `${Math.max(1, Math.round(h * 60))}m` : h < 48 ? `${Math.round(h)}h` : `${Math.round(h / 24)}d`;
const ago = (ms) => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? "just now" : m < 60 ? `${m}m ago` : `${Math.floor(m / 60)}h ${m % 60}m ago`; };
const day = (iso) => new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });

function verdict(reviews) {
  const decisive = reviews.filter((r) => r.state === "APPROVED" || r.state === "CHANGES_REQUESTED");
  return decisive.length ? decisive[decisive.length - 1].state : "COMMENTED";
}
const VERDICT_LABEL = { APPROVED: "approved", CHANGES_REQUESTED: "changes requested", COMMENTED: "commented only" };

function compute() {
  const { prs } = state.data;
  const cutoff = Date.now() - state.days * 86400000;
  const closed = prs.filter((p) => Date.parse(p.closedAt) >= cutoff && (!state.mergedOnly || p.merged));
  const scoped = closed.filter((p) => p.requests.some((r) => !r.bot && r.who !== p.author));
  const members = new Map();
  const get = (who, bot) => {
    if (!members.has(who)) members.set(who, { who, bot, rows: [], unanswered: [], submissions: 0, inline: 0, approved: 0, commented: 0, changes: 0, asked: 0, answered: 0, lat: [], authors: new Set(), authored: 0 });
    return members.get(who);
  };
  const pairs = new Map();
  for (const p of scoped) {
    if (!p.authorBot) get(p.author, false).authored++;
    const byWho = new Map();
    for (const r of p.reviews) {
      if (r.who === p.author) continue;
      if (!byWho.has(r.who)) byWho.set(r.who, []);
      byWho.get(r.who).push(r);
    }
    const askedAt = new Map();
    for (const r of p.requests) {
      if (r.who === p.author || r.who.startsWith("team:")) continue;
      if (!askedAt.has(r.who)) askedAt.set(r.who, { at: Date.parse(r.at), bot: r.bot });
    }
    for (const [who, rs] of byWho) {
      rs.sort((a, b) => a.at.localeCompare(b.at));
      const m = get(who, rs[0].bot);
      const v = verdict(rs);
      const inline = rs.reduce((n, r) => n + r.inline, 0);
      let lat = null;
      const ask = askedAt.get(who);
      if (ask) {
        const first = rs.find((r) => Date.parse(r.at) >= ask.at);
        if (first) lat = (Date.parse(first.at) - ask.at) / 3600000;
      }
      m.rows.push({ pr: p, verdict: v, inline, lat, submissions: rs.length, asked: !!ask });
      m.submissions += rs.length;
      m.inline += inline;
      m[v === "APPROVED" ? "approved" : v === "CHANGES_REQUESTED" ? "changes" : "commented"]++;
      if (lat != null) m.lat.push(lat);
      m.authors.add(p.author);
      const key = `${who}\u0000${p.author}`;
      pairs.set(key, (pairs.get(key) ?? 0) + 1);
    }
    for (const [who, ask] of askedAt) {
      const m = get(who, ask.bot);
      m.asked++;
      if (byWho.has(who)) m.answered++;
      else m.unanswered.push(p);
    }
  }
  const list = [...members.values()].filter((m) => state.bots || !m.bot).map((m) => ({ ...m, reviewed: m.rows.length, medianLat: median(m.lat), authorCount: m.authors.size, answerRate: m.asked ? m.answered / m.asked : -1 }));
  const authors = [...new Set(scoped.map((p) => p.author))].sort((a, b) => scoped.filter((p) => p.author === b).length - scoped.filter((p) => p.author === a).length);
  return { closed, scoped, list, pairs, authors };
}

const COLS = [
  { key: "who", label: "Member", get: (m) => m.who },
  { key: "reviewed", label: "PRs reviewed", get: (m) => m.reviewed },
  { key: "submissions", label: "Submissions", get: (m) => m.submissions, title: "Every review submitted, including re-reviews of the same PR" },
  { key: "inline", label: "Inline comments", get: (m) => m.inline },
  { key: "answerRate", label: "Asked → reviewed", get: (m) => m.answerRate, title: "Of the PRs where this member was requested, how many they reviewed before it closed" },
  { key: "medianLat", label: "Median response", get: (m) => m.medianLat ?? Infinity, title: "Review request → that member's first review after it" },
  { key: "authorCount", label: "Authors", get: (m) => m.authorCount, title: "Distinct authors whose PRs they reviewed" },
  { key: "authored", label: "Own PRs", get: (m) => m.authored, title: "In-scope PRs this member authored" },
];

function render() {
  const d = state.data;
  $("repo").textContent = d ? `· ${d.repo}` : "";
  $("seg").innerHTML = WINDOWS.map((n) => `<button aria-pressed="${n === state.days}" data-days="${n}">${n}d</button>`).join("");
  if (!d) return;
  const s = d.status;
  const chips = (state.mergedOnly ? '<span class="chip">merged only</span>' : "") + (state.bots ? '<span class="chip">bots shown</span>' : "");
  const fetchLine = s.fetching ? (s.mode === "full" ? `Fetching ${d.horizonDays} days from GitHub… ${s.seen} PRs` : `Refreshing… ${s.seen} updated PRs`) : d.fetchedAt ? `Fetched ${ago(d.fetchedAt)} · cached for ${Math.round(d.ttlMs / 60000)}m` : "";
  $("meta").innerHTML = `${fetchLine}${s.error ? ` · <span class="err">fetch failed: ${esc(s.error)}</span>` : ""}${chips}`;
  if (!d.prs.length) {
    $("tiles").innerHTML = "";
    $("members").innerHTML = `<div class="empty">${s.fetching ? "Waiting on the first fetch…" : "No data."}</div>`;
    $("matrix").innerHTML = "";
    return;
  }
  const c = compute();
  state.computed = c;
  const allRows = c.list.flatMap((m) => m.rows);
  const allLat = c.list.flatMap((m) => m.lat);
  const withInline = allRows.filter((r) => r.inline > 0).length;
  $("tiles").innerHTML = [
    [c.scoped.length, `PRs in scope <span class="muted">of ${c.closed.length} closed</span>`],
    [allRows.length, "reviews (one per reviewer per PR)"],
    [dur(median(allLat)), "median request → first review"],
    [allRows.length ? `${Math.round((withInline / allRows.length) * 100)}%` : "—", "of reviews left inline comments"],
  ].map(([v, l]) => `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");

  const col = COLS.find((x) => x.key === state.sort.key);
  const rows = [...c.list].sort((a, b) => { const x = col.get(a), y = col.get(b); return (typeof x === "string" ? x.localeCompare(y) : x - y) * state.sort.dir; });
  const max = Math.max(1, ...c.list.map((m) => m.reviewed));
  const seg = (n, v, label) => n ? `<span style="width:${(n / max) * 100}%;background:var(--${v})" data-tip="${n} ${label}"></span>` : "";
  $("members").innerHTML = rows.length ? `<table><thead><tr>${COLS.map((x) => `<th data-sort="${x.key}" ${x.title ? `title="${esc(x.title)}"` : ""} ${x.key === state.sort.key ? `aria-sort="${state.sort.dir < 0 ? "descending" : "ascending"}"` : ""}>${x.label}${x.key === state.sort.key ? (state.sort.dir < 0 ? " ↓" : " ↑") : ""}</th>${x.key === "reviewed" ? "<th></th>" : ""}`).join("")}</tr></thead><tbody>${rows.map((m) => `<tr data-member="${esc(m.who)}" class="${m.who === state.member ? "sel" : ""}">
    <td>${esc(m.who)}${m.bot ? '<span class="bottag">bot</span>' : ""}</td>
    <td>${m.reviewed}</td>
    <td class="barcell"><div class="bar">${seg(m.approved, "s-approved", "approved")}${seg(m.commented, "s-commented", "commented only")}${seg(m.changes, "s-changes", "changes requested")}</div></td>
    <td>${m.submissions}</td><td>${m.inline}</td>
    <td>${m.asked ? `${m.answered}/${m.asked}` : '<span class="muted">—</span>'}</td>
    <td>${dur(m.medianLat)}</td><td>${m.authorCount}</td><td>${m.authored}</td></tr>`).join("")}</tbody></table>` : '<div class="empty">No PRs in scope for this window.</div>';

  const reviewers = [...c.list].filter((m) => m.reviewed).sort((a, b) => b.reviewed - a.reviewed);
  const pmax = Math.max(1, ...c.pairs.values());
  $("matrix").innerHTML = reviewers.length ? `<table class="matrix"><thead><tr><th></th>${c.authors.map((a) => `<th title="${esc(a)}">${esc(a)}</th>`).join("")}</tr></thead><tbody>${reviewers.map((m) => `<tr><th>${esc(m.who)}</th>${c.authors.map((a) => {
    if (a === m.who) return '<td><div class="self"></div></td>';
    const n = c.pairs.get(`${m.who}\u0000${a}`) ?? 0;
    if (!n) return "<td><div></div></td>";
    const pct = 14 + (n / pmax) * 86;
    return `<td><div class="on" data-pair="${esc(m.who)}|${esc(a)}" data-tip="${esc(m.who)} reviewed ${n} of ${esc(a)}'s PRs" style="background:color-mix(in oklab, var(--seq) ${pct}%, var(--surface));color:${pct > 55 ? "#fff" : "var(--text)"}">${n}</div></td>`;
  }).join("")}</tr>`).join("")}</tbody></table>` : '<div class="empty">No reviews in this window.</div>';
  renderDetail();
}

function renderDetail() {
  const el = $("detail");
  const m = state.computed?.list.find((x) => x.who === state.member);
  if (!m) { el.hidden = true; return; }
  el.hidden = false;
  const rows = m.rows.filter((r) => !state.pair || r.pr.author === state.pair).sort((a, b) => b.pr.closedAt.localeCompare(a.pr.closedAt));
  const prCell = (p) => `<td class="num"><a href="${esc(p.url)}" target="_blank" rel="noreferrer">#${p.n}</a></td><td class="t">${esc(p.title)}${p.merged ? "" : ' <span class="bottag">closed unmerged</span>'}</td><td>${esc(p.author)}</td>`;
  const unanswered = state.pair ? [] : m.unanswered;
  el.innerHTML = `<div class="cardhead"><div><h3>${esc(m.who)}</h3><div class="sub">${state.pair ? `Reviews of ${esc(state.pair)}'s PRs` : `${m.reviewed} PRs reviewed across ${m.authorCount} authors`} · last ${state.days} days</div></div><button class="kbtn" id="closeDetail">close · esc</button></div>
  ${rows.length ? `<table><thead><tr><th class="num">PR</th><th>Title</th><th>Author</th><th>Verdict</th><th class="num">Inline</th><th class="num">Response</th><th class="num">Size</th><th class="num">Closed</th></tr></thead><tbody>${rows.map((r) => `<tr>${prCell(r.pr)}<td>${VERDICT_LABEL[r.verdict]}${r.submissions > 1 ? ` <span class="muted">×${r.submissions}</span>` : ""}</td><td class="num">${r.inline || '<span class="muted">0</span>'}</td><td class="num">${r.asked ? dur(r.lat) : '<span class="muted" title="Reviewed without being requested">unasked</span>'}</td><td class="num">+${r.pr.add} −${r.pr.del}</td><td class="num">${day(r.pr.closedAt)}</td></tr>`).join("")}</tbody></table>` : '<div class="empty">No reviews given in this window.</div>'}
  ${unanswered.length ? `<h4>Requested, closed without their review (${unanswered.length})</h4><table><tbody>${unanswered.map((p) => `<tr>${prCell(p)}<td class="num">+${p.add} −${p.del}</td><td class="num">${day(p.closedAt)}</td></tr>`).join("")}</tbody></table>` : ""}`;
}

function selectMember(who, pair = null) {
  state.member = who; state.pair = pair;
  render();
  if (who) $("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function setDays(n) { state.days = n; store.set("rs.days", n); render(); }

let pollTimer = null;
async function load() {
  try {
    state.data = await (await fetch("/api/data")).json();
  } catch (e) {
    $("meta").innerHTML = `<span class="err">server unreachable — run review-stats again</span>`;
    return;
  }
  render();
  clearTimeout(pollTimer);
  if (state.data.status.fetching) pollTimer = setTimeout(poll, 800);
}
async function poll() {
  const s = await (await fetch("/api/status")).json().catch(() => null);
  if (!s || !s.fetching) return load();
  state.data.status = s; render();
  pollTimer = setTimeout(poll, 800);
}
async function post(path) { await fetch(path, { method: "POST" }); await load(); }

function commands() {
  const cmds = [
    { label: "Clear cache and refetch from GitHub", hint: "full 90 days", run: () => post("/api/clear") },
    { label: "Refresh now", hint: "only PRs updated since last fetch", run: () => post("/api/refresh") },
    ...WINDOWS.map((n) => ({ label: `Window: last ${n} days`, hint: n === state.days ? "current" : "", run: () => setDays(n) })),
    { label: `${state.mergedOnly ? "Include" : "Exclude"} PRs closed without merging`, run: () => { state.mergedOnly = !state.mergedOnly; store.set("rs.merged", state.mergedOnly); render(); } },
    { label: `${state.bots ? "Hide" : "Show"} bot reviewers`, run: () => { state.bots = !state.bots; store.set("rs.bots", state.bots); render(); } },
    ...(state.computed?.list ?? []).map((m) => ({ label: `Member: ${m.who}`, hint: `${m.reviewed} reviewed`, run: () => selectMember(m.who) })),
  ];
  return cmds;
}
let kItems = [], kIdx = 0;
function kRender() {
  const q = $("kq").value.trim().toLowerCase();
  kItems = commands().filter((c) => q.split(/\s+/).every((w) => c.label.toLowerCase().includes(w)));
  kIdx = Math.min(kIdx, Math.max(0, kItems.length - 1));
  $("kl").innerHTML = kItems.map((c, i) => `<li class="${i === kIdx ? "act" : ""}" data-i="${i}"><span>${esc(c.label)}</span><small>${esc(c.hint ?? "")}</small></li>`).join("") || '<li class="muted">No matches</li>';
  $("kl").querySelector(".act")?.scrollIntoView({ block: "nearest" });
}
function kOpen() { $("k").classList.add("open"); $("kq").value = ""; kIdx = 0; kRender(); $("kq").focus(); }
function kClose() { $("k").classList.remove("open"); }
function kRun(i) { const c = kItems[i]; kClose(); c?.run(); }

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("k").classList.contains("open") ? kClose() : kOpen(); return; }
  if ($("k").classList.contains("open")) {
    if (e.key === "Escape") kClose();
    else if (e.key === "ArrowDown") { e.preventDefault(); kIdx = Math.min(kItems.length - 1, kIdx + 1); kRender(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); kIdx = Math.max(0, kIdx - 1); kRender(); }
    else if (e.key === "Enter") { e.preventDefault(); kRun(kIdx); }
    return;
  }
  if (e.key === "Escape" && state.member) selectMember(null);
});
$("kq").addEventListener("input", () => { kIdx = 0; kRender(); });
$("kl").addEventListener("click", (e) => { const li = e.target.closest("li[data-i]"); if (li) kRun(Number(li.dataset.i)); });
$("k").addEventListener("mousedown", (e) => { if (e.target === $("k")) kClose(); });
$("kbtn").addEventListener("click", kOpen);
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.dataset?.days) return setDays(Number(t.dataset.days));
  if (t.id === "closeDetail") return selectMember(null);
  const th = t.closest?.("th[data-sort]");
  if (th) { const key = th.dataset.sort; state.sort = { key, dir: state.sort.key === key ? -state.sort.dir : key === "who" || key === "medianLat" ? 1 : -1 }; return render(); }
  const pair = t.closest?.("[data-pair]");
  if (pair) { const [who, author] = pair.dataset.pair.split("|"); return selectMember(who, author); }
  const tr = t.closest?.("tr[data-member]");
  if (tr) selectMember(tr.dataset.member === state.member && !state.pair ? null : tr.dataset.member);
});
document.addEventListener("mousemove", (e) => {
  const el = e.target.closest?.("[data-tip]"), tip = $("tip");
  if (!el) { tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip; tip.style.display = "block";
  tip.style.left = `${Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8)}px`; tip.style.top = `${e.clientY + 14}px`;
});
window.addEventListener("focus", () => { if (state.data?.fetchedAt && Date.now() - state.data.fetchedAt > state.data.ttlMs) load(); });
render(); load();
</script>
</body>
