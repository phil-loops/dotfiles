<style>
  :root {
    color-scheme: light;
    --page: #f7f8fa; --surface: #fdfdfe; --sunk: #eef1f5;
    --ink: #0b0d10; --ink-2: #4d545e; --muted: #848b95;
    --rule: #dfe3ea; --border: rgba(11, 13, 16, 0.11);
    --accent: #2a78d6; --pg: #2a78d6; --valkey: #4a3aa7;
    --sqs: #eb6834; --s3: #008300; --ses: #e34948;
    --flag: #b3261e; --flag-bg: rgba(179, 38, 30, 0.07);
    --shadow: 0 1px 2px rgba(11, 13, 16, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0c0e11; --surface: #16191d; --sunk: #1d2126;
      --ink: #f4f6f8; --ink-2: #b8bfc9; --muted: #838a94;
      --rule: #262b31; --border: rgba(255, 255, 255, 0.11);
      --accent: #3987e5; --pg: #3987e5; --valkey: #9085e9;
      --sqs: #d95926; --s3: #17a217; --ses: #e66767;
      --flag: #f2857c; --flag-bg: rgba(242, 133, 124, 0.10);
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0c0e11; --surface: #16191d; --sunk: #1d2126;
    --ink: #f4f6f8; --ink-2: #b8bfc9; --muted: #838a94;
    --rule: #262b31; --border: rgba(255, 255, 255, 0.11);
    --accent: #3987e5; --pg: #3987e5; --valkey: #9085e9;
    --sqs: #d95926; --s3: #17a217; --ses: #e66767;
    --flag: #f2857c; --flag-bg: rgba(242, 133, 124, 0.10);
    --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.62 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono, code, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* ---------------------------------------------------------------- layout */
  .app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } .rail { position: static; height: auto; } }

  .rail {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    border-right: 1px solid var(--rule); background: var(--surface); padding: 20px 0 32px;
  }
  .rail .brand { padding: 0 18px 16px; }
  .rail .brand b { display: block; font-size: 13.5px; letter-spacing: -0.01em; }
  .rail .brand span { font-size: 11.5px; color: var(--muted); }
  .rail h4 {
    margin: 18px 0 5px; padding: 0 18px; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted);
  }
  .rail a {
    display: block; padding: 5px 18px; color: var(--ink-2); text-decoration: none;
    font-size: 13.2px; border-left: 2px solid transparent;
  }
  .rail a:hover { background: var(--sunk); color: var(--ink); }
  .rail a.on { border-left-color: var(--accent); color: var(--ink); font-weight: 550; background: var(--sunk); }

  main { padding: 40px 40px 120px; max-width: 760px; }
  @media (max-width: 860px) { main { padding: 28px 20px 90px; } }

  article h1 { font-size: 25px; letter-spacing: -0.021em; margin: 0 0 6px; }
  article .lede { color: var(--ink-2); font-size: 15.5px; margin: 0 0 26px; }
  article h2 { font-size: 16px; letter-spacing: -0.01em; margin: 30px 0 8px; }
  article p { margin: 0 0 14px; }
  article ol, article ul { margin: 0 0 14px; padding-left: 22px; }
  article li { margin: 4px 0; }
  article code { background: var(--sunk); padding: 1.5px 5px; border-radius: 4px; font-size: 0.885em; }
  article pre {
    background: var(--sunk); border: 1px solid var(--rule); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; font-size: 12.6px; margin: 0 0 16px;
  }
  article pre code { background: none; padding: 0; }

  .wl { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .wl:hover { border-bottom-color: var(--accent); }

  /* ---------------------------------------------------------------- citations */
  .cite {
    display: inline; border: 0; background: none; padding: 0; margin: 0; cursor: pointer;
    font: inherit; color: var(--accent); text-align: left;
    border-bottom: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .cite:hover { border-bottom-style: solid; }
  .cite::after { content: " ⌄"; font-size: 0.8em; opacity: 0.55; }
  .cite.open::after { content: " ⌃"; }

  .src {
    margin: 10px 0 18px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--surface); overflow: hidden; box-shadow: var(--shadow);
  }
  .src .head {
    display: flex; align-items: center; gap: 9px; padding: 7px 11px;
    background: var(--sunk); border-bottom: 1px solid var(--rule); font-size: 11.6px;
  }
  .src .head .p { font-family: ui-monospace, Menlo, monospace; color: var(--ink-2); }
  .src .head .k {
    margin-left: auto; color: var(--muted); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .src pre { margin: 0; border: 0; border-radius: 0; background: none; padding: 10px 0; font-size: 12.3px; }
  .src .ln { display: block; padding: 0 12px 0 0; white-space: pre; }
  .src .ln .no {
    display: inline-block; width: 44px; padding-right: 12px; text-align: right;
    color: var(--muted); opacity: 0.6; user-select: none;
  }
  .src .ln.hit { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .src .ln.hit .no { opacity: 1; color: var(--accent); }
  .src .err { padding: 10px 12px; color: var(--flag); background: var(--flag-bg); font-size: 12.8px; }

  /* ---------------------------------------------------------------- ask */
  #pop {
    position: absolute; z-index: 40; display: none; gap: 6px;
    background: var(--ink); color: var(--page); border-radius: 7px;
    padding: 5px 10px; font-size: 12.3px; cursor: pointer; box-shadow: 0 3px 14px rgba(0,0,0,0.3);
    border: 0; font-family: inherit;
  }
  #pop.on { display: block; }

  #drawer {
    position: fixed; right: 0; top: 0; bottom: 0; width: min(460px, 100vw);
    background: var(--surface); border-left: 1px solid var(--rule);
    transform: translateX(100%); transition: transform 0.16s ease;
    display: flex; flex-direction: column; z-index: 50; box-shadow: -8px 0 30px rgba(0,0,0,0.09);
  }
  #drawer.on { transform: none; }
  #drawer .top {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border-bottom: 1px solid var(--rule); font-size: 12.5px; color: var(--muted);
  }
  #drawer .top b { color: var(--ink); font-size: 13px; }
  #drawer .top button { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 17px; }
  #thread { flex: 1; overflow-y: auto; padding: 14px; }
  #drawer .compose { border-top: 1px solid var(--rule); padding: 10px 12px; display: flex; gap: 8px; }
  #drawer textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 7px;
    background: var(--page); color: var(--ink); padding: 8px 10px; font: inherit; font-size: 13.2px;
    min-height: 60px;
  }
  #drawer .compose button {
    align-self: flex-end; border: 0; border-radius: 7px; background: var(--accent);
    color: #fff; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #drawer .compose button:disabled { opacity: 0.45; cursor: default; }

  .qa { margin-bottom: 18px; }
  .qa .sel {
    border-left: 2px solid var(--accent); padding: 3px 0 3px 9px; margin-bottom: 8px;
    color: var(--muted); font-size: 12.2px; font-style: italic;
  }
  .qa .q { font-weight: 560; margin-bottom: 6px; font-size: 13.6px; }
  .qa .st { color: var(--muted); font-size: 11.8px; margin-bottom: 5px; }
  .qa .tool {
    display: inline-block; background: var(--sunk); border-radius: 4px; padding: 1px 6px;
    margin: 0 4px 4px 0; font-family: ui-monospace, Menlo, monospace; font-size: 10.8px; color: var(--ink-2);
  }
  .qa .a { font-size: 13.7px; line-height: 1.6; white-space: pre-wrap; }
  .qa .a code { background: var(--sunk); padding: 1px 4px; border-radius: 3px; font-size: 0.9em; }
  .qa .err { color: var(--flag); }

  .offline {
    margin-top: 26px; border: 1px dashed var(--border); border-radius: 8px;
    padding: 11px 13px; color: var(--muted); font-size: 12.6px;
  }
  .offline code { background: var(--sunk); padding: 1px 5px; border-radius: 4px; }

  footer.lint { margin-top: 46px; border-top: 1px solid var(--rule); padding-top: 14px; font-size: 12px; color: var(--muted); }
  footer.lint .bad { color: var(--flag); display: block; }
  .hint { margin-bottom: 22px; padding: 9px 12px; background: var(--sunk); border-radius: 8px; font-size: 12.5px; color: var(--ink-2); }
</style>

<div class="app">
  <nav class="rail">
    <div class="brand"><b>Mail pipeline</b><span id="count"></span></div>
    <div id="nav"></div>
  </nav>
  <main>
    <article id="page"></article>
    <div id="ask-slot"></div>
    <footer class="lint" id="lint"></footer>
  </main>
</div>

<button id="pop">ask about this</button>

<aside id="drawer">
  <div class="top"><b>Ask</b><span id="scope"></span><button id="close">✕</button></div>
  <div id="thread"></div>
  <div class="compose">
    <textarea id="q" placeholder="Ask about the selection, or anything on this page…"></textarea>
    <button id="send">Ask</button>
  </div>
</aside>

<script>
(() => {
  const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  const $ = (id) => document.getElementById(id);

  let PAGES = [];
  let current = null;
  let selection = null;
  let session = null;

  /* ------------------------------------------------------------ markdown */
  // Deliberately small: the wiki only uses what is rendered here. Anything that needs
  // more markup than this is a sign the page should be split, not that this should grow.
  const inline = (s) =>
    esc(s)
      .replace(/\[([^\]]+)\]\(src:([^)\s]+)\)/g,
        (_, text, anchor) => `<button class="cite" data-anchor="${esc(anchor)}">${text}</button>`)
      .replace(/\[\[([a-z0-9\-]+)\]\]/g, (_, slug) => {
        const p = PAGES.find((x) => x.slug === slug);
        return `<a class="wl" href="#${slug}">${p ? esc(p.title) : slug}</a>`;
      })
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[\s(])\*([^*]+)\*/g, "$1<em>$2</em>");

  function render(md) {
    const out = [];
    const lines = md.split("\n");
    let list = null;
    const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (/^\s{4,}\S/.test(line)) {
        closeList();
        const block = [];
        while (i < lines.length && (/^\s{4,}/.test(lines[i]) || !lines[i].trim())) {
          block.push(lines[i].replace(/^ {4}/, ""));
          i++;
        }
        i--;
        out.push(`<pre><code>${esc(block.join("\n").replace(/\s+$/, ""))}</code></pre>`);
        continue;
      }
      if (!line.trim()) { closeList(); continue; }
      const h = /^(#{2,3})\s+(.*)$/.exec(line);
      if (h) { closeList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
      const ol = /^(\d+)\.\s+(.*)$/.exec(line);
      const ul = /^[-*]\s+(.*)$/.exec(line);
      if (ol || ul) {
        const want = ol ? "ol" : "ul";
        if (list !== want) { closeList(); out.push(`<${want}>`); list = want; }
        out.push(`<li>${inline((ol || ul)[ol ? 2 : 1])}</li>`);
        continue;
      }
      closeList();
      out.push(`<p>${inline(line)}</p>`);
    }
    closeList();
    return out.join("");
  }

  /* ------------------------------------------------------------ nav + routing */
  function buildNav() {
    const host = $("nav");
    host.innerHTML = "";
    let section = null;
    for (const p of PAGES) {
      if (p.section !== section) {
        section = p.section;
        const h = document.createElement("h4");
        h.textContent = section;
        host.appendChild(h);
      }
      const a = document.createElement("a");
      a.href = `#${p.slug}`;
      a.dataset.slug = p.slug;
      a.textContent = p.title;
      host.appendChild(a);
    }
    $("count").textContent = `${PAGES.length} pages · reads your checkout`;
  }

  function show(slug) {
    const page = PAGES.find((p) => p.slug === slug) || PAGES[0];
    current = page;
    document.querySelectorAll(".rail a").forEach((a) => a.classList.toggle("on", a.dataset.slug === page.slug));
    $("page").innerHTML =
      `<h1>${esc(page.title)}</h1>` +
      (page.lede ? `<p class="lede">${inline(page.lede)}</p>` : "") +
      (page.slug === PAGES[0].slug ? `<div class="hint">Dotted links open the real source from your checkout, in place. <b>Select any text</b> to ask about it.</div>` : "") +
      render(page.body);
    $("ask-slot").innerHTML = LOCAL
      ? ""
      : `<div class="offline">Source lookup and questions need the local backend — run <code>mail-map-serve</code> and open <code>localhost:62555</code>.</div>`;
    window.scrollTo(0, 0);
    session = null;
    $("thread").innerHTML = "";
  }

  window.addEventListener("hashchange", () => show(location.hash.slice(1)));

  /* ------------------------------------------------------------ citations */
  document.addEventListener("click", async (e) => {
    const btn = e.target.closest(".cite");
    if (!btn) return;
    // A citation sits mid-sentence, so the source attaches after the whole paragraph —
    // nesting a block inside the <p> would split the sentence around it.
    const block = btn.closest("p, li, h2, h3") || btn;
    const next = block.nextElementSibling;
    if (next && next.classList.contains("src") && next.dataset.anchor === btn.dataset.anchor) {
      next.remove();
      btn.classList.remove("open");
      return;
    }
    btn.classList.add("open");
    const box = document.createElement("div");
    box.className = "src";
    box.dataset.anchor = btn.dataset.anchor;
    box.innerHTML = `<div class="head"><span class="p">loading…</span></div>`;
    block.after(box);

    const res = await fetch(`/src?anchor=${encodeURIComponent(btn.dataset.anchor)}`).then((r) => r.json());
    if (res.err) {
      box.innerHTML = `<div class="err">${esc(res.err)}</div>`;
      return;
    }
    const rows = res.text.split("\n").map((line, i) => {
      const no = res.from + i;
      const hit = no >= res.start && no <= res.end;
      return `<span class="ln${hit ? " hit" : ""}"><span class="no">${no}</span>${esc(line)}</span>`;
    });
    box.innerHTML =
      `<div class="head"><span class="p">${esc(res.path)}:${res.start}–${res.end}</span>` +
      `<span class="k">${res.kind === "symbol" ? "definition" : res.kind === "match" ? "call site" : "pinned range"}</span></div>` +
      `<pre>${rows.join("")}</pre>`;
  });

  /* ------------------------------------------------------------ select to ask */
  const pop = $("pop");

  document.addEventListener("mouseup", (e) => {
    const from = e.target instanceof Element ? e.target : null;
    if (from && (from.closest("#drawer") || from.closest("#pop"))) return;
    setTimeout(() => {
      const sel = window.getSelection();
      const text = sel ? sel.toString().trim() : "";
      if (!text || text.length < 3) { pop.classList.remove("on"); return; }
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      const src = from ? from.closest(".src") : null;
      selection = {
        text,
        anchor: src ? src.dataset.anchor : null,
        path: src ? src.querySelector(".head .p")?.textContent : null,
      };
      pop.style.left = `${window.scrollX + rect.left}px`;
      pop.style.top = `${window.scrollY + rect.bottom + 7}px`;
      pop.classList.add("on");
    }, 0);
  });

  pop.addEventListener("click", () => {
    pop.classList.remove("on");
    openDrawer();
  });

  function openDrawer() {
    $("drawer").classList.add("on");
    $("scope").textContent = selection
      ? `· ${selection.path || current.title}`
      : `· ${current.title}`;
    $("q").focus();
  }

  $("close").addEventListener("click", () => $("drawer").classList.remove("on"));

  /* ------------------------------------------------------------ chat */
  async function ask() {
    const ta = $("q");
    const question = ta.value.trim();
    if (!question) return;
    ta.value = "";
    $("send").disabled = true;

    const qa = document.createElement("div");
    qa.className = "qa";
    qa.innerHTML =
      (selection ? `<div class="sel">${esc(selection.text.slice(0, 220))}</div>` : "") +
      `<div class="q">${esc(question)}</div><div class="st">starting…</div><div class="a"></div>`;
    $("thread").appendChild(qa);
    qa.scrollIntoView({ block: "start" });

    const st = qa.querySelector(".st");
    const ans = qa.querySelector(".a");
    const tools = [];
    const framing = selection
      ? `On this line or passage:\n\n${selection.text}\n\n${question}`
      : question;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          turn: framing,
          question: framing,
          branch: "main",
          path: (selection && selection.anchor ? selection.anchor.split("#")[0] : null) || current.ask,
          resume: session,
        }),
      });
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let text = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const frames = buf.split("\n\n");
        buf = frames.pop();
        for (const frame of frames) {
          const ev = /^event: (.+)$/m.exec(frame);
          const da = /^data: (.+)$/m.exec(frame);
          if (!ev || !da) continue;
          let obj = {};
          try { obj = JSON.parse(da[1]); } catch { continue; }
          const kind = ev[1].trim();
          if (kind === "status") st.textContent = obj.status || "";
          else if (kind === "session") session = obj.session_id || session;
          else if (kind === "tool") {
            tools.push(obj);
            st.innerHTML = tools.map((t) =>
              `<span class="tool">${esc(t.name || "")} ${esc(String(t.arg || "").slice(0, 48))}</span>`).join("");
          } else if (kind === "token") {
            text += obj.text || "";
            ans.innerHTML = esc(text).replace(/`([^`]+)`/g, "<code>$1</code>");
          } else if (kind === "done") st.textContent = "";
          else if (kind === "error") ans.innerHTML = `<span class="err">${esc(obj.err || "backend error")}</span>`;
        }
      }
      if (!text && !ans.innerHTML) {
        ans.innerHTML = `<span class="err">no answer came back — is the viewer running on :62497?</span>`;
      }
    } catch (err) {
      ans.innerHTML = `<span class="err">${esc(err)}</span>`;
    } finally {
      st.textContent = st.textContent === "starting…" ? "" : st.textContent;
      $("send").disabled = false;
      selection = null;
    }
  }

  $("send").addEventListener("click", ask);
  $("q").addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
  });

  /* ------------------------------------------------------------ boot */
  (async () => {
    const data = await fetch("/pages").then((r) => r.json()).catch(() => ({ err: "server not reachable" }));
    if (data.err) {
      $("page").innerHTML = `<p class="err">${esc(data.err)}</p>`;
      return;
    }
    PAGES = data.pages;
    buildNav();
    show(location.hash.slice(1));

    const lint = await fetch("/lint").then((r) => r.json()).catch(() => null);
    if (lint && lint.problems) {
      $("lint").innerHTML = lint.problems.length
        ? lint.problems.map((p) => `<span class="bad">${esc(p.kind)} — ${esc(p.msg)}</span>`).join("")
        : `checks pass · every citation resolves against your checkout`;
    }
  })();
})();
</script>
