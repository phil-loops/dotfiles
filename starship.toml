[kubernetes]
disabled=false

[nodejs]
disabled=true

[aws]
disabled=true

[git_branch]
disabled = true

[git_status]
disabled = true

[directory]
disabled = true

[custom.stack]
command = "/Users/philbrockman/.dotfiles/scripts/stack-prompt.sh"
when = "test -f .stack && grep -q \"^$(git branch --show-current 2>/dev/null):\" .stack 2>/dev/null"
format = "[$output]($style) "
style = "purple"
description = "Git stack position"

[custom.git_simple]
command = "git branch --show-current"
when = "test ! -f .stack || ! grep -q \"^$(git branch --show-current 2>/dev/null):\" .stack 2>/dev/null"
format = "on [$output]($style) "
style = "bold purple"
description = "Git branch when not in stack"
