# Local Grafana + Loki over the loops dev logs — started and stopped by scripts/loops-logs.
name: loops-logs
services:
  loki:
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - 127.0.0.1:3100:3100
    restart: unless-stopped
  ports:
    image: alpine:3.22
    command: /ports.sh
    volumes:
      - ./ports.sh:/ports.sh:ro
      - /private/tmp:/hostlogs:ro
      - alloy-gen:/gen
    healthcheck:
      test: ["CMD", "test", "-f", "/gen/ports.alloy"]
      interval: 2s
      retries: 30
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.20.1
    command: run --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /private/tmp:/hostlogs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
      - alloy-gen:/gen:ro
    depends_on:
      loki:
        condition: service_started
      ports:
        condition: service_healthy
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/loops-logs.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:3900:3000
    depends_on: [loki]
    restart: unless-stopped
volumes:
  loki-data:
  alloy-data:
  alloy-gen:
  grafana-data:
