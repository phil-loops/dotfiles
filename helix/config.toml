# Helix config — lives in ~/.dotfiles/helix, symlinked from ~/.config/helix
# (same pattern as nvim).

# Inside tmux, helix auto-picks tmux's paste buffer, which ⌘V can't see.
[editor]
clipboard-provider = "pasteboard"

# space-f otherwise skips dot-prefixed files (.npmrc, .gitignore, …); git-ignore
# stays on, so ignored files are still filtered out.
[editor.file-picker]
hidden = false

# Off by default: without it, a gd issued while tsgo is still loading the loops
# project queues silently and the editor looks hung.
[editor.lsp]
display-progress-messages = true

# Implicitly trust the loops worktrees and the hover+o scratch worktrees
# (/tmp/stack-study via stack-open; macOS canonicalizes /tmp → /private/tmp).
# Scratch worktrees get a fresh path per open, so without this every hover+o
# re-prompts "Trust this workspace?".
[editor.workspace-trust]
trusted = [
  "~/coding/loops*",
  "/tmp/stack-study/*",
  "/private/tmp/stack-study/*",
]

# space-v / space-V are the same motion at two volumes: both format, save, and commit so the
# blessing viewer (which renders committed diffs) sees the edit. space-v stops there and stays
# in the editor; space-V also starts the push gates and raises Chrome on this branch's node,
# where the push button is. Neither pushes: the viewer's warded ⇧ button is the only door to
# origin. Formatting rides on :write via auto-format (see languages.toml) — there is no
# separate format key, because a format that isn't saved and committed helps nobody here.
# Custom commit message: :w then :sh hx-wc %{buffer_name} your message
#
# space-t = contextual test watcher: write, then drive a tmux pane below Helix running
# node:test --watch on this file's sibling .test.ts (or the buffer itself). Re-runs live
# on every save; one reused pane, not a fresh split per press. See scripts/hx-test.
[keys.normal.space]
# space-n = new file beside this one: prefills `:open "<this dir>/"` with the cursor
# inside the quotes, so you just type the name. Quotes are load-bearing — an expansion
# ENDS an argument, so an unquoted %sh{...}/name.ts opens two files, one of them `/name.ts`.
n = "@:open \"%sh{dirname %{buffer_name}}/\"<C-b>"
v = [":write", ":sh $HOME/.dotfiles/scripts/hx-wc %{buffer_name}"]
V = [":write", ":sh $HOME/.dotfiles/scripts/hx-ship %{buffer_name}"]
t = [":write", ":sh $HOME/.dotfiles/scripts/hx-test %{buffer_name}"]

# space-x = the destructive menu, deliberately two keys. Helix has no file-delete command of its
# own (:delete/:remove/:file complete to nothing), and hx-rm makes the deletion recoverable —
# tracked files via `git rm` (still in HEAD), everything else to ~/.Trash — but recoverable is not
# the same as cheap to trigger: an accident still costs finding the undo line and re-running it,
# for no benefit, since deleting a file is a once-a-week act. So no single slip can reach it.
# The chained buffer-close leaves no buffer pointing at a dead path (a stray :w would recreate the
# file), and it also makes Helix dismiss the :sh popup — `hx-rm --last` reads the undo line back.
[keys.normal.space.x]
d = [":sh $HOME/.dotfiles/scripts/hx-rm %{buffer_name}", ":buffer-close!"]

# space-o = "open" menu: m → on GitHub/main, b → on GitHub/current branch,
# t → the tRPC procedure under the cursor (gd can't reach it: the generated
# .gen declarations inline the router tree, so it only lands on the appRouter).
# Absolute paths: `:sh` inherits the launching process's PATH, so a helix launched by
# something that never ran a zsh at all (LaunchServices, a GUI handoff) still resolves these.
[keys.normal.space.o]
m = ":sh $HOME/.dotfiles/scripts/gh-open %{buffer_name} %{selection_line_start} %{selection_line_end}"
b = ":sh $HOME/.dotfiles/scripts/gh-open --branch %{buffer_name} %{selection_line_start} %{selection_line_end}"
t = ":open %sh{$HOME/.dotfiles/scripts/trpc-goto %{buffer_name} %{cursor_line}}"

[keys.select.space.o]
m = ":sh $HOME/.dotfiles/scripts/gh-open %{buffer_name} %{selection_line_start} %{selection_line_end}"
b = ":sh $HOME/.dotfiles/scripts/gh-open --branch %{buffer_name} %{selection_line_start} %{selection_line_end}"

# gd/gr/gy/gi: :cd into the active buffer's worktree root before goto, so the location
# picker relativizes candidates against THIS buffer's worktree. Helix has one global cwd
# (strip_prefix, no ../), so a warm review-hx reused across scratch worktrees otherwise
# renders every candidate absolute for any buffer outside the cwd it first launched in.
[keys.normal.g]
d = [":cd %sh{$HOME/.dotfiles/scripts/hx-workspace-root %{buffer_name}}", "goto_definition"]
r = [":cd %sh{$HOME/.dotfiles/scripts/hx-workspace-root %{buffer_name}}", "goto_reference"]
y = [":cd %sh{$HOME/.dotfiles/scripts/hx-workspace-root %{buffer_name}}", "goto_type_definition"]
i = [":cd %sh{$HOME/.dotfiles/scripts/hx-workspace-root %{buffer_name}}", "goto_implementation"]
