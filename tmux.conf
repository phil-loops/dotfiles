# Better prefix (Ctrl-a instead of Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Mouse support
set -g mouse on

# Start windows/panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Easy splits (| and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate panes with Alt+hjkl (no prefix needed)
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Don't rename windows automatically
set -g allow-rename off

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Faster escape (for vim)
set -sg escape-time 10

# Longer repeat window for resize keys
set -g repeat-time 675

# Longer history
set -g history-limit 50000

# Claude Code in a split (Ctrl-a Shift-C): adopt the pre-booted claude from the cw-warm
# pool (instant) or cold-start split+cw; evens widths and re-warms either way
bind C run-shell "/Users/philbrockman/.dotfiles/scripts/cw-claim '#{window_id}' '#{pane_current_path}'"

# Restore default new-window (Ctrl-a c)
bind c new-window -c "#{pane_current_path}"

# New session (Ctrl-a S)
bind S new-session

# Vi mode for copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
